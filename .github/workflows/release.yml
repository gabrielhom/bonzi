# Tag v* enviada -> compila no Windows e publica o Bonzi.exe numa release.
# Nova versão: git tag v1.2.3 && git push origin v1.2.3
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: build.cmd
        shell: cmd
      - run: gh release create "${{ github.ref_name }}" Bonzi.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
